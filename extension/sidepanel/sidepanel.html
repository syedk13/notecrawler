<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Panel</title>
    <link href="output.css" rel="stylesheet">
    <style>
        /* ── Dark palette ── */
        :root {
            --nc-bg:       #111113;
            --nc-surf:     #1c1c21;
            --nc-surf2:    #222229;
            --nc-border:   #2d2d36;
            --nc-border2:  #3c3c47;
            --nc-text:     #dcdce2;
            --nc-text2:    #82828e;
            --nc-text3:    #4e4e5a;
            --nc-accent:   #5b8fd4;
            --nc-user-bg:  #172538;
            --nc-user-bdr: #243f5e;
            --nc-red:      #b86060;
        }

        /* ── Panel base ── */
        body { background: var(--nc-bg); color: var(--nc-text); }
        * { scrollbar-width: thin; scrollbar-color: var(--nc-border2) transparent; }

        /* ── HTML-defined element overrides ── */
        .nc-divider { border-color: var(--nc-border) !important; }

        #thread-menu {
            background: var(--nc-surf2);
            border-color: var(--nc-border);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
        }

        #user-input {
            background: var(--nc-surf);
            border-color: var(--nc-border2);
            color: var(--nc-text);
        }
        #user-input::placeholder { color: var(--nc-text3); }
        #user-input:focus {
            border-color: var(--nc-accent);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--nc-accent) 22%, transparent);
            outline: none;
        }

        #send-btn, #ask-btn { background: var(--nc-accent); }
        #send-btn:hover, #ask-btn:hover {
            background: color-mix(in srgb, var(--nc-accent) 82%, white 18%);
        }
        #menu-btn      { color: var(--nc-text2); }
        #menu-btn:hover { color: var(--nc-text); }
        #new-chat-btn      { color: var(--nc-text3); }
        #new-chat-btn:hover { color: var(--nc-text2); }

        /* ── Semantic classes used by JS DOM builders ── */
        .nc-bubble-user {
            background: var(--nc-user-bg);
            border: 1px solid var(--nc-user-bdr);
            color: var(--nc-text);
            border-radius: 1.125rem;
        }
        .nc-bubble-model {
            background: var(--nc-surf2);
            border: 1px solid var(--nc-border);
            color: var(--nc-text);
            border-radius: 1.125rem;
        }
        .nc-bubble-highlight {
            background: var(--nc-surf);
            border: 1px solid var(--nc-border);
            color: var(--nc-text2);
            border-radius: 1.125rem;
            font-style: italic;
        }

        .nc-card {
            background: var(--nc-surf);
            border: 1px solid var(--nc-border);
            border-radius: 0.75rem;
            color: var(--nc-text);
        }
        .nc-card.nc-card-selected {
            background: var(--nc-surf2);
            border-color: var(--nc-border2);
        }

        .nc-text2       { color: var(--nc-text2); }
        .nc-text3       { color: var(--nc-text3); }
        .nc-accent-text { color: var(--nc-accent); }
        .nc-red-text    { color: var(--nc-red); }

        .nc-menu-btn { color: var(--nc-text2); }
        .nc-menu-btn:hover { background: var(--nc-border); color: var(--nc-text); }
        .nc-menu-btn.nc-active { color: var(--nc-accent); font-weight: 600; }

        .nc-tab-active   { color: var(--nc-accent); }
        .nc-tab-inactive { color: var(--nc-text3); }
        .nc-tab-inactive:hover { color: var(--nc-text2); }

        /* Fork button — sits inside model bubble as a footer action */
        .nc-fork-btn {
            display: block;
            margin-top: 0.625rem;
            padding-top: 0.375rem;
            border-top: 1px solid var(--nc-border);
            font-size: 0.6875rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--nc-text2);
            cursor: pointer;
            width: 100%;
        }
        .nc-fork-btn:hover { color: var(--nc-accent); }

        /* More/less clamp toggle — initially hidden via inline style */
        .nc-more-btn {
            display: block;
            font-size: 0.75rem;
            font-style: normal;  /* reset italic inherited from nc-bubble-highlight */
            color: var(--nc-accent);
            cursor: pointer;
            margin-top: 0.375rem;
        }
        .nc-more-btn:hover { text-decoration: underline; }

        .nc-loading { color: var(--nc-text2); font-style: italic; }

        /* Centered empty states */
        .nc-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 2rem 1.5rem;
            gap: 0.5rem;
        }
        .nc-empty-heading {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--nc-text);
            letter-spacing: -0.01em;
        }
        .nc-empty-sub {
            font-size: 0.8125rem;
            color: var(--nc-text2);
            line-height: 1.6;
            max-width: 210px;
        }

        /* ── Markdown content (dark-tuned) ── */
        .md-content > *:first-child { margin-top: 0; }
        .md-content > *:last-child  { margin-bottom: 0; }
        .md-content p               { margin-bottom: 0.5em; }
        .md-content h1, .md-content h2, .md-content h3 {
            font-weight: 600;
            margin-top: 0.75em;
            margin-bottom: 0.25em;
            line-height: 1.3;
        }
        .md-content h1 { font-size: 0.9375rem; }
        .md-content h2 { font-size: 0.875rem; }
        .md-content h3 { font-size: 0.8125rem; }
        .md-content ul, .md-content ol {
            padding-left: 1.25em;
            margin-bottom: 0.5em;
        }
        .md-content ul { list-style-type: disc; }
        .md-content ol { list-style-type: decimal; }
        .md-content li { margin-bottom: 0.2em; }
        .md-content code {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.8125rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.1em 0.3em;
            border-radius: 3px;
        }
        .md-content pre {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.8125rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.5em 0.75em;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 0.5em;
        }
        .md-content pre code { background: none; padding: 0; }
        .md-content blockquote {
            border-left: 3px solid var(--nc-border2);
            padding-left: 0.75em;
            color: var(--nc-text2);
            margin-bottom: 0.5em;
        }
        .md-content strong { font-weight: 600; }
        .md-content em     { font-style: italic; }
        .md-content a      { color: var(--nc-accent); text-decoration: underline; }
        .md-content hr     { border-color: var(--nc-border); margin: 0.5em 0; }
    </style>
</head>
<body class="flex flex-col h-full overflow-hidden text-sm">

    <div class="flex shrink-0 border-b nc-divider">
        <button id="tab-conversation" class="flex-1 py-2 text-xs font-semibold nc-tab-active">Conversation</button>
        <button id="tab-annotations" class="flex-1 py-2 text-xs nc-tab-inactive">Annotations</button>
        <button id="new-chat-btn" class="px-3 py-2 text-xs" title="New chat">+</button>
    </div>

    <div id="conversation-view" class="flex flex-col flex-1 overflow-hidden">

        <div class="relative flex items-center justify-between border-b nc-divider px-3 py-2 shrink-0">
            <span id="thread-title" class="text-xs font-medium nc-text2 truncate">Main Conversation</span>
            <button id="menu-btn" class="ml-2 shrink-0 text-base leading-none px-1">⋮</button>
            <div id="thread-menu" class="hidden absolute top-full right-0 mt-1 border rounded-lg z-10 min-w-[200px] py-1 max-h-64 overflow-y-auto">
            </div>
        </div>

        <div id="side-panel-content" class="flex-1 overflow-y-auto p-3 space-y-2">
        </div>

        <div id="context-card" style="display:none" class="border-t nc-divider px-3 py-2 shrink-0">
        </div>

        <div class="flex items-end gap-2 border-t nc-divider p-3 shrink-0">
            <textarea
                id="user-input"
                rows="1"
                placeholder="Ask a question..."
                class="flex-1 resize-none rounded-lg border px-3 py-2 text-sm focus:outline-none"
            ></textarea>
            <button
                id="send-btn"
                class="rounded-lg px-3 py-2 text-white text-sm font-medium focus:outline-none"
            >Send</button>
        </div>

    </div>

    <div id="annotations-view" style="display:none" class="flex flex-col flex-1 overflow-hidden">

        <div id="annotations-list" class="flex-1 overflow-y-auto p-3 space-y-2">
        </div>

        <div class="border-t nc-divider p-3 shrink-0">
            <button id="ask-btn" class="w-full rounded-lg px-3 py-2 text-white text-sm font-medium focus:outline-none">Ask</button>
        </div>

    </div>

    <script src="../lib/marked.min.js"></script>
    <script src="../lib/purify.min.js"></script>
    <script src="sidepanel.js"></script>
</body>
</html>
