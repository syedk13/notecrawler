<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Panel</title>
    <link href="output.css" rel="stylesheet">
    <style>
        /* Scoped styles for Markdown rendered inside model message bubbles. */
        /* Tailwind's base reset zeroes margins, removes list bullets, etc.  */
        /* These rules restore sensible formatting inside .md-content only.  */
        .md-content > *:first-child { margin-top: 0; }
        .md-content > *:last-child  { margin-bottom: 0; }
        .md-content p               { margin-bottom: 0.5em; }
        .md-content h1, .md-content h2, .md-content h3 {
            font-weight: 600;
            margin-top: 0.75em;
            margin-bottom: 0.25em;
            line-height: 1.3;
        }
        .md-content h1 { font-size: 0.9375rem; }
        .md-content h2 { font-size: 0.875rem; }
        .md-content h3 { font-size: 0.8125rem; }
        .md-content ul, .md-content ol {
            padding-left: 1.25em;
            margin-bottom: 0.5em;
        }
        .md-content ul { list-style-type: disc; }
        .md-content ol { list-style-type: decimal; }
        .md-content li { margin-bottom: 0.2em; }
        .md-content code {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.8125rem;
            background: rgba(0, 0, 0, 0.07);
            padding: 0.1em 0.3em;
            border-radius: 3px;
        }
        .md-content pre {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.8125rem;
            background: rgba(0, 0, 0, 0.07);
            padding: 0.5em 0.75em;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 0.5em;
        }
        .md-content pre code { background: none; padding: 0; }
        .md-content blockquote {
            border-left: 3px solid #d1d5db;
            padding-left: 0.75em;
            color: #6b7280;
            margin-bottom: 0.5em;
        }
        .md-content strong { font-weight: 600; }
        .md-content em     { font-style: italic; }
        .md-content a      { text-decoration: underline; }
        .md-content hr     { border-color: #e5e7eb; margin: 0.5em 0; }
    </style>
</head>
<body class="flex flex-col h-full overflow-hidden bg-white text-sm">

    <div class="flex shrink-0 border-b border-gray-200">
        <button id="tab-conversation" class="flex-1 py-2 text-xs font-semibold text-blue-600">Conversation</button>
        <button id="tab-annotations" class="flex-1 py-2 text-xs text-gray-500 hover:text-gray-700">Annotations</button>
        <button id="new-chat-btn" class="px-3 py-2 text-xs text-gray-400 hover:text-gray-700" title="New chat">+</button>
    </div>

    <div id="conversation-view" class="flex flex-col flex-1 overflow-hidden">

        <div class="relative flex items-center justify-between border-b border-gray-200 px-3 py-2 shrink-0">
            <span id="thread-title" class="text-xs font-medium text-gray-600 truncate">Main Conversation</span>
            <button id="menu-btn" class="ml-2 shrink-0 text-gray-400 hover:text-gray-700 text-base leading-none px-1">⋮</button>
            <div id="thread-menu" class="hidden absolute top-full right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-10 min-w-[200px] py-1 max-h-64 overflow-y-auto">
            </div>
        </div>

        <div id="side-panel-content" class="flex-1 overflow-y-auto p-3 space-y-2">
        </div>

        <div id="context-card" style="display:none" class="border-t border-gray-200 px-3 py-2 shrink-0">
        </div>

        <div class="flex items-end gap-2 border-t border-gray-200 p-3 shrink-0">
            <textarea
                id="user-input"
                rows="1"
                placeholder="Ask a question..."
                class="flex-1 resize-none rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            ></textarea>
            <button
                id="send-btn"
                class="rounded-lg bg-blue-600 px-3 py-2 text-white text-sm font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >Send</button>
        </div>

    </div>

    <div id="annotations-view" style="display:none" class="flex flex-col flex-1 overflow-hidden">

        <div id="annotations-list" class="flex-1 overflow-y-auto p-3 space-y-2">
        </div>

        <div class="border-t border-gray-200 p-3 shrink-0">
            <button id="ask-btn" class="w-full rounded-lg bg-blue-600 px-3 py-2 text-white text-sm font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">Ask</button>
        </div>

    </div>

    <script src="../lib/marked.min.js"></script>
    <script src="../lib/purify.min.js"></script>
    <script src="sidepanel.js"></script>
</body>
</html>
